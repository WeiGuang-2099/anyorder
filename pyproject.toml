[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anyorder"
version = "0.0.1"
description = "Schedule search and replay for multi-agent systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["anyorder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
